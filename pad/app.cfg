# wupstream: a computer's picture, sound and controls on the GamePad. The computer's side is libwupstream
# (this repository's host/): a program there draws, the library encodes it for the pad's
# hardware H.264 decoder and sends it here.
name = WUP Stream
author = wup-homebrew
version = 2.0.0
description = Play from a computer on your network
icon = icon.png
url = https://github.com/ravensclawx/wup-stream
net = yes
defines = WUP_NETIF_RING=65536 WUP_NET_PBUF_POOL=80 WUP_NET_UDP_QUEUE=96
